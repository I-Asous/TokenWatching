# config/pricing.yaml
models:
  claude-opus-4-8:
    input: 5.00
    output: 25.00
    context_window: 1000000
  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
    context_window: 1000000
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
    context_window: 200000
  claude-haiku-3:
    input: 0.25
    output: 1.25
    context_window: 200000

modifiers:
  #batch = 50% off standard rate
  batch_discount: 0.50

  #cached input tokens = 90% cheaper
  cache_read_discount: 0.90

  #placeholder: some models add a premium beyond 200K input ned to verify per-model before enabling
  long_context_surcharge: 1.0

rate_unit: per_million_tokens
last_verified: "2026-09-14"
